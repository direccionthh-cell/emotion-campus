<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Emotion Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-wrapper">
    <aside id="sidebar" data-activo="dashboard"></aside>
    <main class="main-content">
        <section class="hero">
            <div>
                <h1 id="saludo">¡Hola!</h1>
                <p id="resumen"></p>
                <div class="barra"><span id="barraGeneral" style="width:0%"></span></div>
            </div>
            <div class="hero-circulo" id="circulo"><span id="circuloTexto">0%</span></div>
        </section>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">📖</div><div><h2 id="statTotal">0</h2><p>Cursos obligatorios</p></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--purple)">⏳</div><div><h2 id="statCurso">0</h2><p>En curso</p></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--success)">✅</div><div><h2 id="statAprobados">0</h2><p>Aprobados</p></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#EF4444">📌</div><div><h2 id="statPendientes">0</h2><p>Pendientes</p></div></div>
        </div>

        <h2 class="seccion-titulo" id="tituloSiguiente">Continúa donde quedaste</h2>
        <div class="courses-grid" id="siguientes"></div>
    </main>
</div>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script src="js/componentes.js"></script>
<script>
    const nombre = USUARIO_EMAIL.split("@")[0];
    document.getElementById("saludo").textContent = `¡Hola, ${nombre}! 👋`;

    const estados = ORDEN_CURSOS.map(estadoCurso);
    const total = ORDEN_CURSOS.length;
    const aprobados = estados.filter(e => e === "aprobado").length;
    const enCurso = estados.filter(e => e === "en-curso").length;
    const pendientes = total - aprobados - enCurso;
    const pct = Math.round((aprobados / total) * 100);

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statCurso").textContent = enCurso;
    document.getElementById("statAprobados").textContent = aprobados;
    document.getElementById("statPendientes").textContent = pendientes;
    document.getElementById("circuloTexto").textContent = pct + "%";
    document.getElementById("circulo").style.background =
        `conic-gradient(var(--orange) ${pct * 3.6}deg, rgba(255,255,255,.25) 0)`;
    document.getElementById("resumen").textContent = aprobados === total
        ? "¡Completaste todos tus cursos obligatorios! 🎉"
        : `Has aprobado ${aprobados} de ${total} cursos obligatorios. ¡Sigue así!`;
    setTimeout(() => document.getElementById("barraGeneral").style.width = pct + "%", 100);

    // Primero los cursos en curso, luego los pendientes (máximo 3)
    const siguientes = [
        ...ORDEN_CURSOS.filter(id => estadoCurso(id) === "en-curso"),
        ...ORDEN_CURSOS.filter(id => estadoCurso(id) === "pendiente")
    ].slice(0, 3);

    const cont = document.getElementById("siguientes");
    if (siguientes.length === 0) {
        document.getElementById("tituloSiguiente").textContent = "Tus cursos";
        cont.innerHTML = `<div class="course-detail-box">Ya aprobaste todo. Revisa tus notas en <a href="resultados.html">Mis resultados</a>.</div>`;
    } else {
        siguientes.forEach(id => cont.appendChild(tarjetaCurso(id)));
    }
</script>
</body>
</html>
