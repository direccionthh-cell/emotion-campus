<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Emotion Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/images/logo-emotion.jpeg" alt="Emotion">
            e-motion
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="active">🏠 Dashboard</a></li>
            <li><a href="#">📚 Academia</a></li>
            <li><a href="cursos.html">📖 Cursos</a></li>
            <li><a href="#">📊 Evaluaciones</a></li>
            <li><a href="#">🎓 Certificados</a></li>
            <li><a href="#">👥 Usuarios</a></li>
            <li><a href="#">📈 Reportes</a></li>
        </ul>
        <button class="btn-emotion-outline" id="btnLogout">Cerrar sesión</button>
    </aside>
    <main class="main-content">
        <div class="dashboard-header">
            <div>
                <h1 id="saludoUsuario">¡Bienvenido!</h1>
                <p>Este es el resumen general de Emotion Campus</p>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div><h2>185</h2><p>Usuarios activos</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📖</div>
                <div><h2>7</h2><p>Módulos publicados</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div><h2>246</h2><p>Evaluaciones</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎓</div>
                <div><h2>162</h2><p>Certificados emitidos</p></div>
            </div>
        </div>
    </main>
</div>
<script>
    if (localStorage.getItem("sesionActiva") !== "true") {
        window.location.href = "index.html";
    }
    const email = localStorage.getItem("usuarioEmail");
    document.getElementById("saludoUsuario").textContent = `¡Bienvenido, ${email}!`;
    document.getElementById("btnLogout").addEventListener("click", () => {
        localStorage.removeItem("sesionActiva");
        localStorage.removeItem("usuarioEmail");
        window.location.href = "index.html";
    });
</script>
</body>
</html>
