<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Emotion Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-wrapper">
    <aside id="sidebar" data-activo="cursos"></aside>
    <main class="main-content">
        <div class="dashboard-header">
            <div>
                <h1>Catálogo de Cursos</h1>
                <p>Todos los módulos de capacitación obligatorios</p>
            </div>
        </div>
        <div class="filtros">
            <button class="filtro activo" data-filtro="todos">Todos</button>
            <button class="filtro" data-filtro="pendiente">Pendientes</button>
            <button class="filtro" data-filtro="en-curso">En curso</button>
            <button class="filtro" data-filtro="aprobado">Aprobados</button>
            <input type="search" class="buscador" id="buscador" placeholder="🔍 Buscar curso...">
        </div>
        <div class="courses-grid" id="grid"></div>
        <p id="sinResultados" style="display:none;color:#888;">No hay cursos que coincidan.</p>
    </main>
</div>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script src="js/componentes.js"></script>
<script>
    const grid = document.getElementById("grid");
    ORDEN_CURSOS.forEach(id => grid.appendChild(tarjetaCurso(id)));

    let filtro = "todos";
    function aplicarFiltros() {
        const texto = document.getElementById("buscador").value.trim().toLowerCase();
        let visibles = 0;
        grid.querySelectorAll(".course-card").forEach(card => {
            const ok = (filtro === "todos" || card.dataset.estado === filtro) && card.dataset.texto.includes(texto);
            card.style.display = ok ? "" : "none";
            if (ok) visibles++;
        });
        document.getElementById("sinResultados").style.display = visibles ? "none" : "block";
    }

    document.querySelectorAll(".filtro").forEach(btn => btn.addEventListener("click", () => {
        document.querySelectorAll(".filtro").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
        filtro = btn.dataset.filtro;
        aplicarFiltros();
    }));
    document.getElementById("buscador").addEventListener("input", aplicarFiltros);
</script>
</body>
</html>
