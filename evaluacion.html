<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación - Emotion Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-wrapper">
    <aside id="sidebar" data-activo="cursos"></aside>
    <main class="main-content">
        <a href="#" id="volverCurso" class="back-link">← Volver al curso</a>
        <div class="dashboard-header">
            <div>
                <h1 id="evalTitulo">Evaluación</h1>
                <p id="evalSub"></p>
            </div>
        </div>
        <div class="quiz-box" id="quiz"></div>
    </main>
</div>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script>
    const id = new URLSearchParams(location.search).get("id");
    const curso = CURSOS[id];
    const quiz = document.getElementById("quiz");
    document.getElementById("volverCurso").href = `curso.html?id=${id}`;

    // Mezcla una lista (para cambiar el orden en cada intento)
    const mezclar = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

    let preguntas = [];
    let respuestas = [];
    let actual = 0;

    if (!curso || !curso.evaluacion) {
        quiz.innerHTML = "<p>Esta evaluación aún no está disponible.</p>";
    } else if (progresoCurso(id).leccionesVistas.length < curso.lecciones.length) {
        quiz.innerHTML = `<h2>🔒 Evaluación bloqueada</h2><p>Primero completa todas las lecciones del curso.</p>
            <div class="acciones" style="justify-content:flex-start"><a class="btn-emotion" href="curso.html?id=${id}">Ir a las lecciones</a></div>`;
    } else {
        document.getElementById("evalTitulo").textContent = `📝 Evaluación: ${curso.titulo}`;
        document.getElementById("evalSub").textContent = `Necesitas ${NOTA_APROBACION}% para aprobar. Puedes repetirla las veces que necesites.`;
        iniciar();
    }

    function iniciar() {
        // Mezcla preguntas y opciones, recordando cuál es la correcta
        preguntas = mezclar(curso.evaluacion).map(p => {
            const opciones = mezclar(p.opciones.map((texto, i) => ({ texto, correcta: i === p.correcta })));
            return { ...p, opciones };
        });
        respuestas = new Array(preguntas.length).fill(null);
        actual = 0;
        mostrarPregunta();
    }

    function mostrarPregunta() {
        const p = preguntas[actual];
        const ultima = actual === preguntas.length - 1;
        const pct = Math.round((actual / preguntas.length) * 100);
        quiz.style.animation = "none"; quiz.offsetHeight; quiz.style.animation = "aparecer .3s ease";
        quiz.innerHTML = `
            <div class="barra"><span style="width:${pct}%"></span></div>
            <div class="barra-texto">Pregunta ${actual + 1} de ${preguntas.length}</div>
            <h2>${p.pregunta}</h2>
            <div>
                ${p.opciones.map((o, i) => `
                    <div class="opcion ${respuestas[actual] === i ? "elegida" : ""}" onclick="elegir(${i})">
                        <span class="letra">${"ABCD"[i]}</span><span>${o.texto}</span>
                    </div>`).join("")}
            </div>
            <div class="leccion-nav">
                <button class="btn-secundario" ${actual === 0 ? "disabled" : ""} onclick="mover(-1)">← Anterior</button>
                <button class="btn-emotion" id="btnSig" ${respuestas[actual] === null ? "disabled" : ""}
                    onclick="${ultima ? "calificar()" : "mover(1)"}">${ultima ? "Enviar evaluación ✓" : "Siguiente →"}</button>
            </div>
        `;
    }

    function elegir(i) {
        respuestas[actual] = i;
        mostrarPregunta();
    }

    function mover(d) {
        actual += d;
        mostrarPregunta();
    }

    function calificar() {
        const correctas = preguntas.filter((p, i) => p.opciones[respuestas[i]].correcta).length;
        const total = preguntas.length;
        const porcentaje = Math.round((correctas / total) * 100);
        const aprobado = porcentaje >= NOTA_APROBACION;
        registrarIntento(id, porcentaje);

        const revision = preguntas.map((p, i) => {
            const ok = p.opciones[respuestas[i]].correcta;
            const buena = p.opciones.find(o => o.correcta).texto;
            return `<div class="revision-item ${ok ? "" : "mal"}">
                ${ok ? "✅" : "❌"} <strong>${p.pregunta}</strong>
                <small>${ok ? "" : `Respuesta correcta: ${buena}. `}${p.explicacion || ""}</small>
            </div>`;
        }).join("");

        quiz.style.animation = "none"; quiz.offsetHeight; quiz.style.animation = "aparecer .4s ease";
        quiz.innerHTML = `
            <div class="resultado-hero">
                <div style="font-size:48px">${aprobado ? "🎉" : "💪"}</div>
                <div class="nota" style="color:${aprobado ? "var(--success)" : "#EF4444"}">${porcentaje}%</div>
                <h2 style="margin:6px 0">${aprobado ? "¡Aprobaste!" : "Aún no apruebas"}</h2>
                <p style="color:#777">${correctas} de ${total} respuestas correctas.
                ${aprobado ? "El curso quedó marcado como aprobado." : `Necesitas ${NOTA_APROBACION}%. Repasa y vuelve a intentarlo.`}</p>
                <div class="acciones">
                    ${aprobado
                        ? `<a class="btn-emotion" href="cursos.html">Ir al siguiente curso →</a>`
                        : `<button class="btn-emotion" onclick="iniciar()">Intentar de nuevo</button>
                           <a class="btn-secundario" style="text-decoration:none" href="curso.html?id=${id}">Repasar lecciones</a>`}
                </div>
            </div>
            <h3 style="font-size:16px">Revisión de respuestas</h3>
            <div class="revision">${revision}</div>
        `;
    }
</script>
</body>
</html>
