<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Emotion Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard-wrapper">
    <aside id="sidebar" data-activo="cursos"></aside>
    <main class="main-content">
        <a href="cursos.html" class="back-link">← Volver al catálogo</a>
        <div class="dashboard-header">
            <div>
                <h1 id="cursoTitulo">Cargando...</h1>
                <p id="cursoDescripcion"></p>
            </div>
        </div>
        <div class="curso-layout" id="cursoLayout">
            <div class="lecciones-lista">
                <h3>Contenido</h3>
                <div class="barra"><span id="barraCurso" style="width:0%"></span></div>
                <div class="barra-texto" id="barraTexto"></div>
                <div id="listaLecciones" style="margin-top:14px;"></div>
            </div>
            <div class="leccion-panel" id="panel"></div>
        </div>
    </main>
</div>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script>
    const id = new URLSearchParams(location.search).get("id");
    const curso = CURSOS[id];
    let actual = 0;

    if (!curso) {
        document.getElementById("cursoTitulo").textContent = "Curso no encontrado";
        document.getElementById("cursoLayout").style.display = "none";
    } else {
        document.title = curso.titulo + " - Emotion Campus";
        document.getElementById("cursoTitulo").textContent = `${curso.icono} ${curso.titulo}`;
        document.getElementById("cursoDescripcion").textContent = `${curso.descripcion} · ⏱ ${curso.duracion}`;
        // Abrir en la primera lección no vista
        const vistas = progresoCurso(id).leccionesVistas;
        const primeraPendiente = curso.lecciones.findIndex((_, i) => !vistas.includes(i));
        actual = primeraPendiente === -1 ? 0 : primeraPendiente;
        mostrar(actual);
    }

    function totalPasos() { return curso.lecciones.length + 1; } // lecciones + evaluación

    function dibujarLista() {
        const p = progresoCurso(id);
        const todasVistas = p.leccionesVistas.length >= curso.lecciones.length;
        const lista = document.getElementById("listaLecciones");
        lista.innerHTML = "";

        curso.lecciones.forEach((l, i) => {
            const vista = p.leccionesVistas.includes(i);
            const item = document.createElement("div");
            item.className = "leccion-item" + (vista ? " vista" : "") + (i === actual ? " actual" : "");
            item.innerHTML = `<span class="leccion-num">${vista ? "✓" : i + 1}</span>${l.titulo}`;
            item.addEventListener("click", () => mostrar(i));
            lista.appendChild(item);
        });

        const ev = document.createElement("div");
        ev.className = "leccion-item" + (todasVistas ? "" : " bloqueada") + (p.aprobado ? " vista" : "");
        ev.innerHTML = `<span class="leccion-num">${p.aprobado ? "✓" : todasVistas ? "📝" : "🔒"}</span>Evaluación final`;
        ev.title = todasVistas ? "" : "Completa todas las lecciones para desbloquearla";
        ev.addEventListener("click", () => { if (todasVistas) location.href = `evaluacion.html?id=${id}`; });
        lista.appendChild(ev);

        const pct = p.aprobado ? 100 : Math.round((p.leccionesVistas.length / totalPasos()) * 100);
        document.getElementById("barraCurso").style.width = pct + "%";
        document.getElementById("barraTexto").textContent = p.aprobado
            ? `✅ Aprobado con ${p.porcentaje}%`
            : `${p.leccionesVistas.length} de ${curso.lecciones.length} lecciones vistas`;
    }

    function mostrar(i) {
        actual = i;
        marcarLeccionVista(id, i);
        const l = curso.lecciones[i];
        const ultima = i === curso.lecciones.length - 1;
        const video = l.video ? `<iframe src="${l.video}" allowfullscreen></iframe>` : "";

        const panel = document.getElementById("panel");
        panel.style.animation = "none"; panel.offsetHeight; panel.style.animation = "aparecer .35s ease";
        panel.innerHTML = `
            <div class="paso">Lección ${i + 1} de ${curso.lecciones.length}</div>
            <h2>${l.titulo}</h2>
            ${video}
            ${l.contenido}
            <div class="leccion-nav">
                <button class="btn-secundario" ${i === 0 ? "disabled" : ""} onclick="mostrar(${i - 1})">← Anterior</button>
                ${ultima
                    ? `<button class="btn-emotion" onclick="location.href='evaluacion.html?id=${id}'">Ir a la evaluación 📝</button>`
                    : `<button class="btn-emotion" onclick="mostrar(${i + 1})">Siguiente →</button>`}
            </div>
        `;
        dibujarLista();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
</script>
</body>
</html>
